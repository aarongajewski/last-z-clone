<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Last Z" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Browser clone of Last Z: Survival Shooter." />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Last Z Clone</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
      }
      body {
        /* position: fixed + overscroll-behavior stop iOS Safari rubber-banding. */
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: auto;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        background: #0b0f14;
        color: #e6edf3;
        font-size: 20px;
        text-align: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
      #install-hint[hidden] {
        display: none;
      }
      #install-hint {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 16px;
        background: #1b232e;
        border: 1px solid #ffd166;
        color: #e6edf3;
        font-size: 15px;
        line-height: 1.35;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        animation: install-hint-in 0.3s ease-out;
      }
      #install-hint .install-hint-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #install-hint strong {
        color: #ffd166;
      }
      #install-hint svg {
        vertical-align: -5px;
        margin: 0 2px;
      }
      #install-hint .install-hint-close {
        flex: none;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: #2a3340;
        color: #e6edf3;
        font-size: 26px;
        line-height: 1;
      }
      @keyframes install-hint-in {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your phone to portrait to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
